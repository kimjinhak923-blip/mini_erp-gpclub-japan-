name: Keep Streamlit App Alive

on:
  schedule:
    # 6시간마다 자동으로 웹 서버에 접속 Ping을 보냅니다 (12시간 자동재우기 방지)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # 아래 URL을 실제 본인의 Streamlit 앱 주소로 변경하세요.
          curl -s https://your-app-name.streamlit.app/ > /dev/null
